# Install on the Ubuntu host, not inside Docker.
# Replace server_name and the allowed subnet if the LAN changes.
map $http_upgrade $asia_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name 192.168.17.23;

    allow 127.0.0.1;
    allow 192.168.16.0/23;
    deny all;

    client_max_body_size 10m;

    # Direct proxy preserves the real client IP for backend rate limits.
    location /backend-api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $asia_connection_upgrade;
    }
}
