# HTTPS + HTTP/2 version of asia-portal.conf. Use this one instead of asia-portal.conf
# once a certificate exists (steps: docs/deploy-ubuntu.md, section "HTTPS").
# Install on the Ubuntu host, not inside Docker.
# Replace server_name, the certificate paths and the allowed subnets for the real setup.
#
# HTTP/2 puts every request of a browser (pages, API, images, the notification stream)
# on one connection, so the browser limit of 6 connections per site no longer applies.
# Needs nginx 1.25.1 or newer for "http2 on;" (check: nginx -v). On older nginx remove
# "http2 on;" and write "listen 443 ssl http2;" instead.
map $http_upgrade $asia_connection_upgrade {
    default upgrade;
    '' close;
}

# Plain http only sends people to the https address.
server {
    listen 80;
    server_name asiafnb.vn 192.168.26.26;
    return 301 https://asiafnb.vn$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name asiafnb.vn;

    ssl_certificate     /etc/ssl/asia-portal/fullchain.pem;
    ssl_certificate_key /etc/ssl/asia-portal/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:asia_ssl:10m;
    ssl_session_timeout 1d;

    allow 127.0.0.1;
    allow 192.168.16.0/20;
    deny all;

    # Employee uploads can include a 5 MB source and a 5 MB cropped image.
    client_max_body_size 12m;

    # Live notification stream (Server-Sent Events): passed on at once, kept open.
    # The backend pings every 25 s and closes it every 10 minutes.
    location ~ ^/backend-api/(user|admin)/notifications/stream$ {
        rewrite ^/backend-api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }

    # Direct proxy preserves the real client IP for backend rate limits.
    location /backend-api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $asia_connection_upgrade;
    }
}
