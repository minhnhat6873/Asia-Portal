services:
  - type: web
    name: asia-portal-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: TRUST_PROXY_HOPS
        value: 1

  - type: web
    name: asia-portal-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: yarn install --frozen-lockfile --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: BACKEND_API_URL
        value: https://asia-portal-api.onrender.com
      - key: NEXT_PUBLIC_TINYMCE_API_KEY
        sync: false
