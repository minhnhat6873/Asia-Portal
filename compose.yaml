name: asia-portal

services:
  mongodb:
    # Ghim bản đã kiểm thử trên kernel Ubuntu 26.04 của server; đổi bản thì phải thử lại.
    image: mongo:8.0.34
    # Replica set 1 node vì backend dùng transaction. Không publish cổng: chỉ container trong Compose kết nối được.
    command: ["--replSet", "rs0", "--bind_ip_all", "--keyFile", "/etc/mongo/keyfile", "--wiredTigerCacheSizeGB", "0.5"]
    env_file:
      - ./deploy/mongodb/.env
    environment:
      # MongoDB đọc nhầm kernel Ubuntu 7.0.0-xx (thực tế 7.0.14) và từ chối chạy: SERVER-136848.
      # Xóa dòng này khi đã nâng lên bản MongoDB có bản sửa lỗi.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - mongodb_data:/data/db
      - ./deploy/mongodb/keyfile:/etc/mongo/keyfile:ro
      - ./deploy/mongodb/setup.js:/etc/mongo/setup.js:ro
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: ./backend
      target: production
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "4000"
      TRUST_PROXY_HOPS: "1"
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        BACKEND_API_URL: http://backend:4000
        NEXT_PUBLIC_TINYMCE_API_KEY: ${NEXT_PUBLIC_TINYMCE_API_KEY:-}
        NEXT_PUBLIC_NETWORK_FOLDER_PATH: ${NEXT_PUBLIC_NETWORK_FOLDER_PATH:?Set NEXT_PUBLIC_NETWORK_FOLDER_PATH in frontend/.env and use --env-file frontend/.env}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mongodb_data:
    # Volume tạo sẵn ngoài Compose để `docker compose down -v` không xóa nhầm dữ liệu.
    external: true
    name: asia_portal_mongodb_data
